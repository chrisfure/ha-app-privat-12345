      </div>
      <button class="ikonknapp" id="til-innstillinger" aria-label="Innstillinger"><svg><use href="#i-tannhjul"/></svg></button>

    <section class="visning" id="v-oversikt"></section>
    <section class="visning" id="v-transaksjoner" hidden></section>

    <section class="visning" id="v-innstillinger" hidden></section>

  <nav class="fanerad" id="faner">

    <button data-fane="transaksjoner"><svg><use href="#i-liste"/></svg><span>Transaksjoner</span></button>

  </nav>

  <div class="ark-bakgrunn" id="ark-bakgrunn" hidden></div>
  <div class="ark" id="ark" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
