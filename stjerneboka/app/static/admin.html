<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stjerneboka</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="static/admin.css">
</head>
<body>
  <main class="app">
    <header class="topp">
      <h1>⭐ Stjerneboka</h1>
      <a class="lenke" id="barneside-lenke" target="_blank" rel="noopener">Åpne barnesiden ↗</a>
    </header>
    <nav class="faner" id="faner">
      <button data-fane="oversikt" class="aktiv">Oversikt</button>
      <button data-fane="oppgaver">Oppgaver</button>
      <button data-fane="barn">Barn</button>
      <button data-fane="kort">NFC-kort</button>
      <button data-fane="innstillinger">Innstillinger</button>
    </nav>
    <section class="fane" id="f-oversikt"></section>
    <section class="fane" id="f-oppgaver" hidden></section>
    <section class="fane" id="f-barn" hidden></section>
    <section class="fane" id="f-kort" hidden></section>
    <section class="fane" id="f-innstillinger" hidden></section>
  </main>

  <dialog id="dialog"><form method="dialog" id="dialog-innhold"></form></dialog>
  <div class="toast" id="toast" hidden></div>
  <script src="static/admin.js"></script>
</body>
</html>
